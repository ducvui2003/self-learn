# Zope instance configuration for Phase 2 (ZODB Persistence).
# Run from the phase-2/ folder: .\run.bat

%define INSTANCE .

instancehome $INSTANCE

debug-mode on
security-policy-implementation C
verbose-security off

# ZODB storage: persistent EmployeeFolder and Employee objects are saved in var/Data.fs
<zodb_db main>
    <filestorage>
      path $INSTANCE/var/Data.fs
    </filestorage>
    mount-point /
</zodb_db>
