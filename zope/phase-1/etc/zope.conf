# Zope instance configuration.
# Run from the phase-1/ folder: ..\ .venv\Scripts\runwsgi etc/zope.ini
# Spring equivalent: application.yml (datasource + app settings).

%define INSTANCE .

instancehome $INSTANCE

debug-mode on
security-policy-implementation C
verbose-security off

# ZODB storage: Zope stores its internal object tree in var/Data.fs
<zodb_db main>
    <filestorage>
      path $INSTANCE/var/Data.fs
    </filestorage>
    mount-point /
</zodb_db>
