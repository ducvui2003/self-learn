# Zope instance configuration for Phase 6 (Testing, Indexing, Logging & Production).
# Run from the phase-6/ folder: .\run.bat
# Run automated pytest suite:    .\test.bat

%define INSTANCE .

instancehome $INSTANCE

debug-mode on
security-policy-implementation C
verbose-security off

# Production tip: adjust cache-size (number of ZODB objects kept in RAM per connection).
# For multi-worker clusters, replace <filestorage> with <zeoclient> or <relstorage> (MySQL).
<zodb_db main>
    cache-size 30000
    <filestorage>
      path $INSTANCE/var/Data.fs
    </filestorage>
    mount-point /
</zodb_db>
