# WSGI server configuration (PasteDeploy format).
# Production tip: tune `threads` (e.g. 4-8) or run behind Nginx reverse proxy.

[app:main]
use = egg:Zope#main
zope_conf = %(here)s/zope.conf

[server:main]
use = egg:waitress#main
listen = 127.0.0.1:8080
threads = 4

[loggers]
keys = root, waitress, employee_api

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_waitress]
level = INFO
handlers = console
qualname = waitress
propagate = 0

[logger_employee_api]
level = INFO
handlers = console
qualname = employee_api
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
