# Zope instance configuration for Phase 4 (REST API Deep Dive).
# Run from the phase-4/ folder: .\run.bat

%define INSTANCE .

instancehome $INSTANCE

debug-mode on
security-policy-implementation C
verbose-security off

<zodb_db main>
    <filestorage>
      path $INSTANCE/var/Data.fs
    </filestorage>
    mount-point /
</zodb_db>
