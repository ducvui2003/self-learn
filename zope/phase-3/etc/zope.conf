# Zope instance configuration for Phase 3 (ZCA & Layered REST API).
# Run from the phase-3/ folder: .\run.bat

%define INSTANCE .

instancehome $INSTANCE

debug-mode on
security-policy-implementation C
verbose-security off

<zodb_db main>
    <filestorage>
      path $INSTANCE/var/Data.fs
    </filestorage>
    mount-point /
</zodb_db>
