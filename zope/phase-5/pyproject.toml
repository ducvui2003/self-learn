[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-api"
version = "0.5.0"
description = "Phase 5: Zope Security (RBAC / Basic Auth) & MySQL Integration (SQLAlchemy + zope.sqlalchemy)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Zope[wsgi]>=5.13,<6.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "zope.sqlalchemy>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
