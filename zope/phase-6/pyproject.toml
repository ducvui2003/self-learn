[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-api"
version = "0.6.0"
description = "Phase 6: Testing (pytest + WebTest), ZODB/Catalog Indexing, Structured Logging, Scaling & Legacy Zope 2"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Zope[wsgi]>=5.13,<6.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
