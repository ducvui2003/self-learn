[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-api"
version = "0.3.0"
description = "Phase 3: ZCA (Interfaces, Utilities, Adapters, Events, Subscribers & ZCML)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Zope[wsgi]>=5.13,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
