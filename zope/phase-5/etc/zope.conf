# Zope instance configuration for Phase 5 (Security + MySQL / SQLAlchemy).
# Run from the phase-5/ folder: .\run.bat

%define INSTANCE .

instancehome $INSTANCE

debug-mode on
security-policy-implementation C
verbose-security off

# ZODB still stores Zope's object tree and acl_users (users & roles),
# while business tables (employees, audit_logs) live in MySQL (or SQLite fallback).
<zodb_db main>
    <filestorage>
      path $INSTANCE/var/Data.fs
    </filestorage>
    mount-point /
</zodb_db>
